backend:
  connector: null
  decode_environment: &id001
    DYN_REQUEST_PLANE: tcp
    ETCD_LEASE_TTL: '600'
    HF_HOME: /lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/common/cache
    MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
    NCCL_CUMEM_ENABLE: '1'
    NCCL_MNNVL_ENABLE: '1'
    NCCL_NET_PLUGIN: none
    NCCL_NVLS_ENABLE: '1'
    NCCL_P2P_LEVEL: NVL
    SRTCTL_FAILURE_TAIL_LINES: '400'
    TILELANG_CLEANUP_TEMP_FILES: '1'
    UCX_MEMTYPE_CACHE: n
    UCX_MEMTYPE_REG_WHOLE: n
    UCX_RCACHE_MAX_UNRELEASED: '1024'
    UCX_TCP_AF_PRIO: inet
    VLLM_ALLREDUCE_USE_FLASHINFER: '1'
    VLLM_CONNECTOR_PREFETCH_DEPTH: '8'
    VLLM_CONNECTOR_PREFETCH_KV_CAP: '0.65'
    VLLM_ENGINE_READY_TIMEOUT_S: '3600'
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
    VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT: '0'
    VLLM_MOONCAKE_LOAD_RECV_THREADS: '4'
    VLLM_PREFIX_CACHE_RETENTION_INTERVAL: '12288'
    VLLM_RPC_TIMEOUT: '600000'
    VLLM_SERVER_DEV_MODE: '1'
    VLLM_SSM_CONV_STATE_LAYOUT: DS
    VLLM_USE_DIRECT_DCP_A2A: '0'
    VLLM_USE_DIRECT_DCP_KV_GATHER: '0'
    VLLM_USE_DIRECT_DCP_Q_GATHER: '0'
    VLLM_USE_NCCL_SYMM_MEM: '0'
    VLLM_USE_RUST_FRONTEND: '1'
    VLLM_USE_V2_MODEL_RUNNER: '1'
    WITH_NVIDIA_PEERMEM: '0'
  dp_launch_mode: per_node
  kv_events_config:
    prefill: true
  prefill_environment: *id001
  type: vllm
  vllm_config:
    decode:
      attention-backend: TOKENSPEED_MLA
      attention-config: '{"mla_prefill_backend": "TRTLLM_RAGGED", "use_prefill_query_quantization":
        true}'
      compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","mode":0}'
      decode-context-parallel-size: 8
      distributed-timeout-seconds: 3600
      enable-cumem-allocator: true
      enable-prefix-caching: true
      kv-cache-dtype: fp8
      kv-transfer-config: '{"kv_connector":"NixlPushConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}}'
      language-model-only: true
      load-format: fastsafetensors
      max-cudagraph-capture-size: 1024
      max-num-seqs: 256
      no-enable-flashinfer-autotune: true
      prefix-match-unit: 128
      served-model-name: moonshotai/Kimi-K3
      speculative-config: '{"model":"Inferact/Kimi-K3-DSpark","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":4,"draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":3.36}'
      stream-interval: 10
      tensor-parallel-size: 8
      trust-remote-code: true
    prefill:
      attention-backend: TOKENSPEED_MLA
      attention-config: '{"mla_prefill_backend": "TRTLLM_RAGGED", "use_prefill_query_quantization":
        true}'
      decode-context-parallel-size: 8
      distributed-timeout-seconds: 3600
      enable-cumem-allocator: true
      enable-prefix-caching: true
      kv-cache-dtype: fp8
      kv-transfer-config: '{"kv_connector":"NixlPushConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}}'
      language-model-only: true
      load-format: fastsafetensors
      max-cudagraph-capture-size: 512
      max_num_batched_tokens: 16384
      no-enable-flashinfer-autotune: true
      pipeline-parallel-size: 2
      prefix-match-unit: 128
      served-model-name: moonshotai/Kimi-K3
      speculative-config: '{"model":"Inferact/Kimi-K3-DSpark","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":4,"draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":3.36}'
      stream-interval: 10
      tensor-parallel-size: 8
      trust-remote-code: true
benchmark:
  command: bash /configs/kimi-wideep-prefix-cache-profile.sh
  env:
    HF_HUB_CACHE: /hf_hub_cache
    PROFILE_CACHE_FILL_OSL: '1'
    PROFILE_CONCURRENCY: '8'
    PROFILE_ISL: '131072'
    PROFILE_MODEL_NAME: moonshotai/Kimi-K3
    PROFILE_NUM_PROMPTS: '8'
    PROFILE_OSL: '1024'
    PROFILE_SEED: '0'
    PROFILE_TOKENIZER_PATH: moonshotai/Kimi-K3
  type: custom
dynamo:
  hash: ba83080ecd31c1ce918559e576d3c5bc9e092ff1
  install: true
environment_unset:
- UCX_TLS
- UCX_NET_DEVICES
frontend:
  args:
    router-mode: random
    router-session-affinity-ttl-secs: 900
  enable_multiple_frontends: false
  env:
    DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: '3600'
    DYN_TOKENIZER_CACHE_BYTES: '8589934592'
    HF_HOME: /lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/common/cache
  type: dynamo
health_check:
  interval_seconds: 10
  max_attempts: 720
infra:
  etcd_nats_dedicated_node: false
  nats_max_payload_mb: 32
model:
  container: vllm/vllm-openai:nightly-5a4c8d99242e9e069b604d0e9b969e77f7dd501d
  path: hf:moonshotai/Kimi-K3
  precision: fp4
name: kimi-k3-mxfp4-gb300-disagg-1p1d-tp8dcp8pp2-tp8dcp8-pushpp-dspark-ret12288-c8-oci
resources:
  decode_nodes: 2
  decode_workers: 1
  gpu_type: gb300
  gpus_per_decode: 8
  gpus_per_node: 4
  gpus_per_prefill: 16
  prefill_nodes: 4
  prefill_workers: 1
sbatch_directives:
  comment: '''{"OccupiedIdleGPUsJobReaper":{"exemptIdleTimeMins":"60","reason":"model_loading","description":"Very
    large model will take extra loading time."}}'''
  cpus-per-task: '72'
  mem: '0'
setup_script: kimi-k3-gb300-pp.sh
slurm:
  account: coreai_comparch_inferencex
  partition: batch
  time_limit: 04:00:00
srun_options:
  container-remap-root: ''
  mem: '0'
